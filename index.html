<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuskUltima — OSR Dungeon Crawler</title>
  <!-- Google Fonts: Pixel & Retro Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" class="ultima-container">
    <!-- Top Header / Bar -->
    <header class="ultima-header retro-border">
      <div class="header-title">DUSK ULTIMA</div>
      <div class="header-info">
        <span id="loc-display">Dungeon: Gloom Below</span>
        <span id="turn-display">Round: 1</span>
        <span id="light-display" class="light-active">Torch: 60m</span>
      </div>
    </header>

    <!-- Main Content Area: Viewport + Side Panel -->
    <main class="ultima-main">
      <!-- Left / Center: Tile Viewport -->
      <div class="viewport-wrapper retro-border">
        <canvas id="game-canvas" width="576" height="576"></canvas>
        <div id="viewport-overlay" class="viewport-overlay"></div>
      </div>

      <!-- Right Side: Party Status Box -->
      <aside class="party-sidebar retro-border">
        <div class="sidebar-header">PARTY STATUS</div>
        <div id="party-list" class="party-list">
          <!-- Populated by UltimaFrame.ts -->
        </div>
        <div class="leader-help">Press <span class="key-badge">1-4</span> to swap leader. Shift + direction = double near.</div>
      </aside>
    </main>

    <!-- Bottom Section: Message Log & Action Bar -->
    <footer class="ultima-footer retro-border">
      <!-- Scrollable Retro Message Log -->
      <div id="log-panel" class="log-panel">
        <div class="log-entry log-system">Welcome to DuskUltima. Shadowdark OSR rules engine engaged.</div>
        <div class="log-entry log-prompt">Type or press command keys: [A]ttack, [C]ast, [L]ook, [T]orch, [U]se, [I]nv, [R]est, [V]ideo (CRT toggle)...</div>
      </div>

      <!-- Command Shortcuts Bar -->
      <div class="command-bar">
        <button class="cmd-btn" data-cmd="attack"><span class="cmd-key">A</span>ttack</button>
        <button class="cmd-btn" data-cmd="cast"><span class="cmd-key">C</span>ast</button>
        <button class="cmd-btn" data-cmd="look"><span class="cmd-key">L</span>ook</button>
        <button class="cmd-btn" data-cmd="torch"><span class="cmd-key">T</span>orch</button>
        <button class="cmd-btn" data-cmd="use"><span class="cmd-key">U</span>se Item</button>
        <button class="cmd-btn" data-cmd="inventory"><span class="cmd-key">I</span>nventory</button>
        <button class="cmd-btn" data-cmd="rest"><span class="cmd-key">R</span>est</button>
        <button class="cmd-btn" data-cmd="pass"><span class="cmd-key">P</span>ass Turn</button>
        <button class="cmd-btn" data-cmd="stats"><span class="cmd-key">S</span>tats</button>
      </div>
    </footer>

    <!-- Overlay Modals Container -->
    <div id="modal-container" class="modal-overlay hidden">
      <div id="modal-content" class="modal-window retro-border">
        <button id="modal-close" class="modal-close-btn">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
